--[[  raml.ch desktop overlay
      A live host/network panel painted onto the desktop, top-right.
      Same information as the login banner, always current.

      Install:
        sudo apt install conky-all
        mkdir -p ~/.config/conky
        cp conky-raml.conf ~/.config/conky/conky.conf
        cp raml-logo.png  ~/.config/conky/        (optional, see image block)

      Autostart:
        cp raml-conky.desktop ~/.config/autostart/

      IMPORTANT — X11 only. On Ubuntu's default Wayland session the overlay
      will not draw. Log in via "Ubuntu on Xorg" (gear icon at the login
      screen). Kali's Xfce is X11 already and needs no change.
]]

conky.config = {
    -- placement
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 48,
    minimum_width = 300,
    maximum_width = 340,

    -- draw as a desktop layer, not a floating window
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- rendering
    double_buffer = true,
    update_interval = 2.0,
    background = true,
    draw_shades = true,
    default_shade_color = '211F1C',   -- ink, for legibility on any wallpaper

    -- type
    use_xft = true,
    font = 'Montserrat:size=9',
    override_utf8_locale = true,

    -- brand palette
    default_color = 'F4EFE4',         -- cream
    color1 = 'C0473A',                -- swiss red  (accents / the address)
    color2 = 'ADA89E',               -- muted ink  (labels)
}

conky.text = [[
${color1}${font Montserrat:bold:size=22}raml.ch${font}${color}
${color2}${hr 2}${color}
${color1}${font Montserrat:bold:size=11}◆ ${nodename_short}${font}${color}
${voffset 4}${color2}host    ${color}${nodename}
${color2}os      ${color}${execi 3600 . /etc/os-release; echo $NAME}
${color2}kernel  ${color}${kernel}
${color2}uptime  ${color}${uptime_short}
${voffset 6}${color2}${hr 1}${color}
${voffset 4}${color2}iface   ${color}${gw_iface}
${color2}addr    ${color1}${font Montserrat:bold:size=10}${addr ${gw_iface}}${font}${color}
${color2}gateway ${color}${gw_ip}
${color2}dns     ${color}${execi 30 awk '/^nameserver/{printf "%s ",$2}' /etc/resolv.conf}
${voffset 6}${color2}${hr 1}${color}
${voffset 4}${color2}cpu     ${color}${cpu}%   ${color2}mem  ${color}${memperc}%
${color2}load    ${color}${loadavg 1}
]]
